[project]
name = "mrelay-mcp"
version = "0.0.1"
description = "MCP bridge for MixedRelay v0.0.1"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "psutil>=5.9.0",
]

[project.scripts]
mrelay-mcp = "mrelay_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
